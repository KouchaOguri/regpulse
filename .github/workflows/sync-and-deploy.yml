name: Sync Live FDA Data & Deploy RegPulse

on:
  push:
    branches: ["main"]
  schedule:
    # Auto-sync official openFDA & FDA.gov recalls every 12 hours (02:15 & 14:15 UTC)
    - cron: "15 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync latest live FDA data
        env:
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
        run: python scripts/sync_fda_data.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro static site & programmatic SEO pages
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kouchaoguri.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/regpulse' }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
