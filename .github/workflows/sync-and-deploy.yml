name: Sync Live FDA Data, Verify Facts, Dispatch Alerts & Deploy RegPulse

on:
  push:
    branches: ["main"]
  schedule:
    # Auto-sync official openFDA Recalls & FDA.gov Warning Letters every 12 hours (02:15 & 14:15 UTC)
    - cron: "15 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright Chromium for official FDA.gov Warning Letters sync
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Sync live openFDA recalls & provenance manifest
        env:
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
        run: python scripts/sync_fda_data.py

      - name: Sync live FDA.gov Warning Letters (newest 200 entries)
        run: python scripts/sync_warning_letters.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Hard Anti-Hallucination Gate, 40-Rule Tests, Fulfillment E2E & Astro Build
        env:
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://kouchaoguri.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/regpulse' }}
        run: |
          npm run build
          node scripts/test_fulfillment_loop.mjs

      - name: Dispatch automated 7x24 Watchlist Alerts to active paid subscribers (if Worker secrets set)
        env:
          FULFILLMENT_API_URL: ${{ secrets.FULFILLMENT_API_URL }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: python scripts/dispatch_watchlist_alerts.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository for IndexNow URL list
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow Search Engines (Bing/Yandex/Naver/Seznam when custom domain active)
        env:
          SITE_URL: ${{ vars.SITE_URL || '' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/ping_indexnow.py
